spring.application.name=order-service
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://mongodb:27017/order_db}
server.port=${PORT:8084}
jwt.secret=${JWT_SECRET:MySimpleJwtSecretKeyForEcommerceApp123456}
product.service.url=${PRODUCT_SERVICE_URL:http://product-service:8082}
user.service.url=${USER_SERVICE_URL:http://user-service:8081}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://*.netlify.app}

# ── Email (JavaMailSender via Gmail SMTP) ────────────────────────────────────
# Set MAIL_USERNAME and MAIL_PASSWORD as environment variables.
# For Gmail: generate an App Password at https://myaccount.google.com/apppasswords
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
